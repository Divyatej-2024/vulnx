services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/vulnx.db
    volumes:
      - vulnx-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  updater:
    build:
      context: ./backend
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: sqlite:////app/data/vulnx.db
      UPDATE_INTERVAL_HOURS: ${UPDATE_INTERVAL_HOURS:-24}
    volumes:
      - vulnx-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/vulnx-ui
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    ports:
      - "${VULNX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vulnx-data:
