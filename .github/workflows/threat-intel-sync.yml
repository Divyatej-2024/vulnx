name: VulnX threat intelligence sync

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnx-threat-intelligence-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync CISA KEV and FIRST EPSS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
      - name: Verify database secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is not configured."
            exit 1
          fi
      - name: Synchronise public exploitation intelligence
        run: python -m app.intel.sync
