name: Chromium UI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/vulnx-ui/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        working-directory: frontend/vulnx-ui
        run: npm ci
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend/vulnx-ui
        run: |
          npm start > /tmp/vulnx-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vulnx-frontend.log
          exit 1
        env:
          CI: "true"
      - name: Run Chromium responsive and runtime checks
        run: python -m pytest -q tests/browser
        env:
          VULNX_BASE_URL: http://127.0.0.1:3000
      - name: Upload frontend startup log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vulnx-chromium-diagnostics
          path: /tmp/vulnx-frontend.log
          if-no-files-found: ignore
